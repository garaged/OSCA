governed_indexes:
  requirements: docs/governance/requirements-catalog.md
  contracts: docs/governance/contract-catalog.md
  deferred_decisions: docs/governance/deferred-decisions.md
  exceptions: docs/governance/architecture-exceptions.md
  traceability: docs/governance/traceability-register.md
  validation: docs/validation/checks.yaml

relationship_types:
  - derives_from
  - satisfies
  - constrained_by
  - owned_by
  - exposes
  - consumes
  - produces
  - implemented_by
  - verified_by
  - observed_by
  - migrates
  - supersedes

validation:
  unique_ids_required: true
  dangling_references_forbidden: true
  lifecycle_value_must_be_declared: true
  owner_required: true
  review_authority_required: true
  frozen_artifacts_require_supersession: true
  public_contract_owner_required: true
  active_exceptions_require_expiry_or_removal_trigger: true
  evidence_requires_source_revision: true
