registry_version: 2
project:
  id: OSCA
  architecture_baseline: M0
  status: m9-active
  validated_by: docs/validation/m0x-validation-record.md

authorities:
  product-authority: product requirements and scope
  architecture-authority: architecture decisions and boundaries
  security-authority: security requirements and risk disposition
  quality-authority: verification strategy and evidence sufficiency
  repository-maintainers: repository policy and automated enforcement

artifact_types:
  adr:
    owner: architecture-authority
    lifecycle: [draft, reviewed, accepted, baseline, frozen, superseded, rejected, deprecated]
    review_authority: architecture-authority
  requirement:
    owner: product-authority
    lifecycle: [draft, active, superseded, retired, deferred]
    review_authority: product-authority
  contract:
    owner: owning-capability
    lifecycle: [draft, proposed, accepted, supported, deprecated, retired]
    review_authority: architecture-authority
  capability:
    owner: architecture-authority
    lifecycle: [proposed, active, deprecated, retired]
    review_authority: architecture-authority
  workflow:
    owner: owning-capability
    lifecycle: [proposed, active, deprecated, retired]
    review_authority: architecture-authority
  specification:
    owner: owning-capability
    lifecycle: [draft, proposed, accepted, superseded, retired]
    review_authority: architecture-authority
  exception:
    owner: named-exception-owner
    lifecycle: [proposed, active, expired, closed, revoked]
    review_authority: governing-authority
  evidence:
    owner: quality-authority
    lifecycle: [draft, complete, accepted, invalidated, retained]
    review_authority: quality-authority

