name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify affected components
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${GITHUB_SHA}")"
          else
            files="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          fi
          if grep -Eq '^(src/|tests/|scripts/|migrations/|examples/|pyproject\.toml$|uv\.lock$|alembic\.ini$)' <<<"$files"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  python-and-architecture:
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Install pinned age interoperability fixture
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/age.tar.gz \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz" \
            | sha256sum --check -
          tar --extract --gzip --no-same-owner --file /tmp/age.tar.gz --directory /tmp
      - name: Ruff
        run: uv run ruff check --fix --diff .
      - name: Strict mypy
        run: uv run mypy
      - name: Tests, contracts, migrations, links, and architecture
        run: uv run pytest
        env:
          AGE_TEST_EXECUTABLE: /tmp/age/age
      - name: Trusted-local extension conformance
        run: |
          uv run osca extension validate \
            --manifest examples/extensions/offline-mean/osca-extension.json

  contributor-rehearsal:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: contributor-rehearsal (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Run canonical contributor validation
        run: uv run python scripts/contributor_check.py
        env:
          DO_NOT_TRACK: "1"

  package-lifecycle:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: package-lifecycle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: uv build
      - name: Generate checksums, SBOM, and provenance
        run: |
          uv run python scripts/build_release_artifacts.py \
            --dist-dir dist \
            --output-dir release-artifacts \
            --source-commit "${GITHUB_SHA}" \
            --source-repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
      - name: Verify release artifact checksums
        shell: bash
        run: |
          cd dist
          while read -r digest artifact; do
            actual="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            test "$actual" = "$digest"
          done < ../release-artifacts/SHA256SUMS
      - name: Install wheel in isolated uv tool environment
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv tool install --force "$wheel"
          osca version | tee release-artifacts/version-${{ matrix.platform }}.json
      - name: Exercise packaged lifecycle commands
        shell: bash
        run: |
          profile="${RUNNER_TEMP}/osca-profile"
          backup="${RUNNER_TEMP}/osca-profile.zip"
          restored="${RUNNER_TEMP}/osca-restored"
          osca init --profile-root "$profile"
          osca lifecycle inspect --profile-root "$profile"
          osca lifecycle backup --profile-root "$profile" --output "$backup"
          osca lifecycle restore --backup "$backup" --profile-root "$restored"
          osca lifecycle inspect --profile-root "$restored"
      - uses: actions/upload-artifact@v4
        with:
          name: osca-release-artifacts-${{ matrix.platform }}
          path: release-artifacts/
          if-no-files-found: error

  release-candidate-acceptance:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [python-and-architecture, contributor-rehearsal, package-lifecycle]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked environment
        run: uv sync --locked
      - name: Build candidate artifacts
        run: uv build
      - name: Generate official acceptance input
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          sdist="$(find dist -name '*.tar.gz' -print -quit)"
          uv run python scripts/generate_rc_acceptance_input.py \
            --candidate-version "0.1.0rc1" \
            --source-commit "${GITHUB_SHA}" \
            --artifact "$wheel" \
            --artifact "$sdist" \
            --output release-acceptance/input.json
      - name: Enforce official acceptance and defect threshold
        run: |
          uv run osca-rc-acceptance evaluate \
            --input release-acceptance/input.json \
            --output release-acceptance/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: osca-release-candidate-acceptance
          path: release-acceptance/
          if-no-files-found: error

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked OpenSpec tooling
        run: npm ci --ignore-scripts
        env:
          DO_NOT_TRACK: "1"
      - name: OpenSpec doctor
        run: npm run openspec:doctor
        env:
          DO_NOT_TRACK: "1"
      - name: Strict OpenSpec validation
        run: npm run openspec:validate
        env:
          DO_NOT_TRACK: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}