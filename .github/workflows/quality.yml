name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  python-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Install pinned age interoperability fixture
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/age.tar.gz \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz" \
            | sha256sum --check -
          tar --extract --gzip --no-same-owner --file /tmp/age.tar.gz --directory /tmp
      - name: Ruff
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy
      - name: Tests, contracts, migrations, links, and architecture
        run: uv run pytest
        env:
          AGE_TEST_EXECUTABLE: /tmp/age/age

  package-lifecycle:
    name: package-lifecycle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: uv build
      - name: Generate checksums, SBOM, and provenance
        run: |
          uv run python scripts/build_release_artifacts.py \
            --dist-dir dist \
            --output-dir release-artifacts \
            --source-commit "${GITHUB_SHA}" \
            --source-repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
      - name: Verify release artifact checksums
        shell: bash
        run: |
          cd dist
          while read -r digest artifact; do
            actual="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            test "$actual" = "$digest"
          done < ../release-artifacts/SHA256SUMS
      - name: Install wheel in isolated uv tool environment
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv tool install --force "$wheel"
          osca version | tee release-artifacts/version-${{ matrix.platform }}.json
      - name: Exercise packaged lifecycle commands
        shell: bash
        run: |
          profile="${RUNNER_TEMP}/osca-profile"
          backup="${RUNNER_TEMP}/osca-profile.zip"
          restored="${RUNNER_TEMP}/osca-restored"
          osca init --profile-root "$profile"
          osca lifecycle inspect --profile-root "$profile"
          osca lifecycle backup --profile-root "$profile" --output "$backup"
          osca lifecycle restore --backup "$backup" --destination "$restored"
          osca lifecycle inspect --profile-root "$restored"
      - uses: actions/upload-artifact@v4
        with:
          name: osca-release-artifacts-${{ matrix.platform }}
          path: release-artifacts/
          if-no-files-found: error

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked OpenSpec tooling
        run: npm ci --ignore-scripts
        env:
          DO_NOT_TRACK: "1"
      - name: OpenSpec doctor
        run: npm run openspec:doctor
        env:
          DO_NOT_TRACK: "1"
      - name: Strict OpenSpec validation
        run: npm run openspec:validate
        env:
          DO_NOT_TRACK: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
