name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  python-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Install pinned age interoperability fixture
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/age.tar.gz \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age.tar.gz" \
            | sha256sum --check -
          tar --extract --gzip --file /tmp/age.tar.gz --directory /tmp
      - name: Ruff
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy
      - name: Tests, contracts, migrations, links, and architecture
        run: uv run pytest
        env:
          AGE_TEST_EXECUTABLE: /tmp/age/age

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked OpenSpec tooling
        run: npm ci --ignore-scripts
        env:
          DO_NOT_TRACK: "1"
      - name: OpenSpec doctor
        run: npm run openspec:doctor
        env:
          DO_NOT_TRACK: "1"
      - name: Strict OpenSpec validation
        run: npm run openspec:validate
        env:
          DO_NOT_TRACK: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
