name: Desktop Foundation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "apps/desktop/**"
      - "src/osca/desktop_api/**"
      - "tests/test_d1_desktop_api.py"
      - "tests/test_d2_desktop_api.py"
      - ".github/workflows/desktop-foundation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-desktop-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff desktop boundary
        run: uv run ruff check src/osca/desktop_api tests/test_d1_desktop_api.py tests/test_d2_desktop_api.py
      - name: Strict mypy desktop boundary
        shell: bash
        run: |
          set +e
          output="$(uv run mypy src/osca/desktop_api 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status != 0 )); then
            while IFS= read -r line; do
              echo "::error title=Strict mypy::$line"
            done <<< "$output"
            exit "$status"
          fi
      - name: Desktop API tests
        run: uv run pytest tests/test_d1_desktop_api.py tests/test_d2_desktop_api.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  rust-broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust format
        shell: bash
        run: |
          set +e
          output="$(cargo fmt --check 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status != 0 )); then
            while IFS= read -r line; do
              echo "::error title=Rust format::$line"
            done <<< "$output"
            exit "$status"
          fi
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
