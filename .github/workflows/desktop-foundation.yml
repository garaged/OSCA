name: Desktop Foundation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "apps/desktop/**"
      - "src/osca/desktop_api/**"
      - "tests/test_d1_desktop_api.py"
      - "tests/test_d2_desktop_api.py"
      - ".github/workflows/desktop-foundation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-desktop-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff desktop boundary
        run: uv run ruff check src/osca/desktop_api tests/test_d1_desktop_api.py tests/test_d2_desktop_api.py
      - name: Strict mypy desktop boundary
        shell: bash
        run: |
          set +e
          output="$(uv run mypy src/osca/desktop_api 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status != 0 )); then
            while IFS= read -r line; do
              echo "::error title=Strict mypy::$line"
            done <<< "$output"
            exit "$status"
          fi
      - name: Desktop API tests
        run: uv run pytest tests/test_d1_desktop_api.py tests/test_d2_desktop_api.py
      - name: Verify bundled sample in wheel
        shell: bash
        run: |
          uv build --wheel
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          required = "osca/desktop_api/sample_data/synthetic_aapl_daily.csv"
          with ZipFile(wheel) as archive:
              if required not in archive.namelist():
                  raise SystemExit(f"bundled desktop sample missing from wheel: {required}")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  rust-broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust format
        shell: bash
        run: |
          set +e
          output="$(cargo fmt --check 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status != 0 )); then
            while IFS= read -r line; do
              echo "::error title=Rust format::$line"
            done <<< "$output"
            exit "$status"
          fi
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  linux-desktop-package-smoke:
    name: linux-x86_64 desktop package smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build Debian desktop package
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles deb
      - name: Smoke packaged desktop binary
        shell: bash
        run: |
          binary="apps/desktop/src-tauri/target/release/osca-desktop"
          test -x "$binary"
          set +e
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            timeout 15s xvfb-run -a "$binary" \
            > linux-desktop-smoke.log 2>&1
          status=$?
          set -e
          cat linux-desktop-smoke.log
          if (( status != 124 )); then
            echo "Packaged desktop exited before the bounded smoke window (status ${status})."
            exit "$status"
          fi
      - name: Verify Debian package
        shell: bash
        run: |
          package="$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: osca-d1-d2-linux-desktop-package
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            linux-desktop-smoke.log
          if-no-files-found: error
