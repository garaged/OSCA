name: U13 Refresh Lock

on:
  push:
    branches: [agent/u13-release-candidate-acceptance]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/u13-release-candidate-acceptance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Regenerate lockfile
        run: uv lock
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh lockfile for OSCA 0.1.0rc1"
          git push origin HEAD:agent/u13-release-candidate-acceptance
