[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "osca"
version = "0.1.0rc1"
description = "Local-first market intelligence and quantitative research platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "keyring>=25.6,<26",
  "opentelemetry-api>=1.35,<2",
  "opentelemetry-sdk>=1.35,<2",
  "pydantic>=2.11,<3",
  "pyarrow>=25,<26",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "httpx2>=2,<3",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
osca = "osca.cli:main"
osca-research-pipeline = "osca.research_pipeline:main"
osca-rc-acceptance = "osca.release_acceptance_cli:main"

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osca"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/osca/analyst_workspace/app.py" = ["E501"]
"src/osca/analyst_workspace/evidence.py" = ["SIM102", "SIM103"]
"src/osca/analyst_workspace/visualization.py" = ["E501", "B008", "F401"]
"src/osca/desktop_api/asset_catalog.py" = ["E501"]
"src/osca/desktop_api/d4_service.py" = ["E501"]
"src/osca/desktop_api/stdio.py" = ["E501"]
"src/osca/quantitative_analysis/services.py" = ["E501", "F401"]
"src/osca/ml_experiments/contracts.py" = ["E501"]
"src/osca/ml_experiments/services.py" = ["E501", "F401", "B009", "RUF007", "SIM102"]
"src/osca/ml_experiments/engine.py" = ["E501", "I001", "B009"]
"tests/test_makefile.py" = ["I001"]
"tests/test_u10_research_evidence_workspace.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["osca"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["osca.quantitative_analysis.services"]
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = ["osca.ml_experiments.services"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["osca.analyst_workspace.evidence"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
